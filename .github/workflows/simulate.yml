name: 每日社区推演

# V7 社区模拟：每天凌晨在 GitHub Actions 里跑一次「当天」推演（World → 各角色决策 →
# 写记忆 / 可选足迹），直接连 Neon 写库（不走 Vercel 函数，避免 LLM 调用被函数超时打断）。
# 白天用户访问只读库、不触发模拟。幂等：当天已模拟的角色自动跳过。
on:
  schedule:
    - cron: "30 18 * * *" # UTC 18:30 = JST 03:30（每日凌晨，排在数据抓取 03:00 之后）
  workflow_dispatch:
    inputs:
      date:
        description: "模拟某一天 (YYYY-MM-DD)，留空 = 今天(东京)"
        required: false
        default: ""
      from:
        description: "回填起始日 (YYYY-MM-DD)，需与 to 一起用"
        required: false
        default: ""
      to:
        description: "回填结束日 (YYYY-MM-DD)"
        required: false
        default: ""
      image_model:
        description: "生图模型（OpenAI 无额度或限流时会自动降级到 Agnes）"
        required: true
        type: choice
        default: "gpt-image-2"
        options:
          - "gpt-image-2"
          - "agnes-image-2.1-flash"
          - "none"
      regenerate_images_date:
        description: "仅重新生成该东京日期的模拟图片 (YYYY-MM-DD)，留空则正常推演"
        required: false
        default: ""

# 避免与上一次未结束的运行重叠
concurrency:
  group: daily-simulate
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    # 每日单天很快；手动回填一段(--from/--to)可能数百次 LLM 调用，放宽超时。
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Prisma 7 依赖要求 node >=22（与抓取 workflow 一致）。
          node-version: "22"
      - name: 安装依赖
        run: yarn install --frozen-lockfile
      - name: 生成 Prisma Client
        run: yarn prisma generate
      - name: 跑社区推演
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IMAGE_PROVIDER: ${{ secrets.IMAGE_PROVIDER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_IMAGE_API_URL: ${{ secrets.OPENAI_IMAGE_API_URL }}
          OPENAI_IMAGE_MODEL: ${{ secrets.OPENAI_IMAGE_MODEL }}
          OPENAI_IMAGE_SIZE: "1024x1536"
          OPENAI_IMAGE_QUALITY: "medium"
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          AGNES_MODEL: ${{ secrets.AGNES_MODEL }}
          AGNES_API_URL: ${{ secrets.AGNES_API_URL }}
          # 使用人物身份参考图锁定脸和发型；场景、服装与道具仍由每日 prompt 决定。
          IMAGE_IDENTITY_REFERENCE: "true"
          # LLM = DeepSeek（OpenAI 兼容端点）；与 extract 复用同一 LLM_API_KEY secret。
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_PROVIDER: deepseek
          LLM_MODEL: deepseek-chat
          LLM_BASE_URL: https://api.deepseek.com
          # 记录 DeepSeek 生成的场景 prompt，便于区分提示词与生图模型问题。
          IMAGE_PROMPT_LOG: "true"
          # 手动触发时的可选参数（schedule 触发时均为空 → 默认跑「今天」）。
          IN_DATE: ${{ github.event.inputs.date }}
          IN_FROM: ${{ github.event.inputs.from }}
          IN_TO: ${{ github.event.inputs.to }}
          IN_IMAGE_MODEL: ${{ github.event.inputs.image_model }}
          IN_REGENERATE_IMAGES_DATE: ${{ github.event.inputs.regenerate_images_date }}
        run: |
          ARGS=""
          case "$IN_IMAGE_MODEL" in
            "gpt-image-2")
              export IMAGE_PROVIDER="openai"
              export OPENAI_IMAGE_MODEL="gpt-image-2"
              ;;
            "agnes-image-2.1-flash")
              export IMAGE_PROVIDER="agnes"
              export AGNES_MODEL="agnes-image-2.1-flash"
              ;;
            "none")
              export IMAGE_PROVIDER="none"
              ;;
          esac
          if [ -n "$IN_REGENERATE_IMAGES_DATE" ]; then
            echo "重新生成模拟图片: $IN_REGENERATE_IMAGES_DATE"
            npx tsx scripts/regenerate-sim-images.ts --date="$IN_REGENERATE_IMAGES_DATE" --apply
            exit 0
          elif [ -n "$IN_FROM" ] && [ -n "$IN_TO" ]; then
            ARGS="--from=$IN_FROM --to=$IN_TO"
          elif [ -n "$IN_DATE" ]; then
            ARGS="--date=$IN_DATE"
          fi
          echo "运行参数: ${ARGS:-(今天)}"
          echo "生图模型: ${IN_IMAGE_MODEL:-$IMAGE_PROVIDER（定时任务配置）}"
          npx tsx scripts/sim-run.ts $ARGS
